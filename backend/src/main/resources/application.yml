spring:
  application:
    name: queueless-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/queueless_db?useSSL=true&enabledTLSProtocols=TLSv1.2,TLSv1.3}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:queueless_user}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:queueless_pass}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:15}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:${SPRING_REDIS_HOST:localhost}}
      port: ${REDIS_PORT:${SPRING_REDIS_PORT:6379}}
      username: ${REDIS_USERNAME:${SPRING_REDIS_USERNAME:default}}
      password: ${REDIS_PASSWORD:${SPRING_REDIS_PASSWORD:}}
      ssl:
        enabled: ${SPRING_REDIS_SSL_ENABLED:true}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

queueless:
  jwt:
    secret: ${JWT_SECRET:9a2f8c4e7b1a3d6f8e2c5b9a4f7e1c3d6b8a2f4e7b1a3d6f8e2c5b9a4f7e1c3d}
    expiration-ms: ${JWT_EXPIRATION:86400000} # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  guest:
    secret: ${GUEST_SECRET:${JWT_SECRET:9a2f8c4e7b1a3d6f8e2c5b9a4f7e1c3d6b8a2f4e7b1a3d6f8e2c5b9a4f7e1c3d}}
  qr:
    secret: ${QR_SECRET:super-secret-qr-hmac-key-queueless-2026}
  queue:
    max-starvation-threshold-sec: 600
    default-grace-period-min: 15

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.queueless: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
