spring:
  datasource:
    url: jdbc:h2:mem:queueless_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

queueless:
  jwt:
    secret: 9a2f8c4e7b1a3d6f8e2c5b9a4f7e1c3d6b8a2f4e7b1a3d6f8e2c5b9a4f7e1c3d
    expiration-ms: 86400000
  qr:
    secret: test-qr-secret-key-for-unit-tests-2026
  queue:
    max-starvation-threshold-sec: 600
    default-grace-period-min: 15
