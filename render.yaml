services:
  - type: web
    name: queueless-backend
    env: java
    buildCommand: "./mvnw clean package"
    startCommand: "java -XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -jar target/queueless-backend-1.0.0-SNAPSHOT.jar"
    rootDir: backend
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_VERSION
        value: "21"
      - key: PORT
        value: "8080"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GUEST_SECRET
        sync: false
      - key: QR_SECRET
        sync: false
