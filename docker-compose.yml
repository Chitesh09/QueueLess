version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: queueless_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: queueless_db
      MYSQL_USER: queueless_user
      MYSQL_PASSWORD: queueless_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - queueless_net

  redis:
    image: redis:7-alpine
    container_name: queueless_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - queueless_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: queueless_backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/queueless_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: queueless_user
      SPRING_DATASOURCE_PASSWORD: queueless_password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: d1FhOFk5dW00c01MOGZROWRKNDk0OW1zZGs5MzA0OTBtMDA0OTMwbXNkZzkwMzk0MDk0OW0zMDQ5MG1zZGc5MA
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_logs:/var/log/queueless
    networks:
      - queueless_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: queueless_frontend
    restart: always
    networks:
      - queueless_net

  nginx:
    image: nginx:alpine
    container_name: queueless_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - queueless_net

volumes:
  mysql_data:
  redis_data:
  app_logs:

networks:
  queueless_net:
    driver: bridge
